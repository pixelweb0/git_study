<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>JS with Mouse Event</title>
  </head>

  <style>
    #mouse {
      width: 240px;
      height: 390px;
      border: 1px solid #333;
      border-radius: 150px;
      overflow: hidden;
    }

    #btns {
      position: relative;
      display: flex;
      width: 100%;
      height: 150px;
      border-bottom: 1px solid #333;
    }

    #btn0 {
      width: calc(50% - 1px);
      height: 100%;
      border-right: 1px solid #333;
    }

    #btn1 {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 90px;
      border-radius: 20px;
      border: 1px solid #333;
    }

    #btn2 {
      width: 50%;
      height: 100%;
    }

    .btn {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: 900;
    }

    .clicked-0 #btn0 {
      background: #eb2f2f;
    }

    .clicked-1 #btn1 {
      background: #ffb62e;
    }

    .clicked-2 #btn2 {
      background: #ffff58;
    }

    .dblclick #btn0 {
      background: #0cb30c;
    }
  </style>

  <body>
    <div id="mouse">
      <div id="btns">
        <div id="btn0" class="btn"></div>
        <div id="btn1" class="btn"></div>
        <div id="btn2" class="btn"></div>
      </div>
    </div>

    <script src="mouse-button.js"></script>
  </body>
</html>
