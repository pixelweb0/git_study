<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>JS with Todo</title>
  </head>

  <style>
    .item {
      margin: 10px 0;
      cursor: pointer;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.3;
    }
  </style>

  <body>
    <div id="content">
      <h1 id="title">오늘 할 일</h1>
      <ul id="today">
        <li class="item">자바스크립트 공부</li>
        <li class="item">고양이 화장실청소</li>
        <li class="item">책 읽기</li>
        <li class="item">컴퓨터 공부</li>
        <li class="item">뮤지컬 공연 예매</li>
      </ul>
    </div>

    <script src="todo.js"></script>
  </body>
</html>
