<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>JS with Mouse Event</title>
  </head>

  <style>
    * {box-sizing: border-box;}
    body {padding: 50px;}
    .box {
      display: flex;
      width: 350px;
      height: 350px;
    }

    #box1 {
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin-bottom: 40px;
      background: #acfffc;
    }

    #box2 {
      position: relative;
      flex-flow: row wrap;
      padding: 35px;
      background: #b6ffaa;
    }

    #box2 .title {
      position: absolute;
      top: 8px;
      left: 0;
      width: 100%;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }

    .cell {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 900;
      opacity: .1;
    }

    .on {
      opacity: 1;
    }

    #cell-1,
    #cell-4 {
      color: #fff;
      background: #000;
    }

    #cell-2,
    #cell-3 {
      color: #000;
      background: #fff;
    }
    
  </style>
  
  <body>
    <div id="box1" class="box">
      Box1
    </div>
    <div id="box2" class="box">
      <b class="title">mouseover / mouseout</b>
      <div id="cell-1" class="cell">cell-1</div>
      <div id="cell-2" class="cell">cell-2</div>
      <div id="cell-3" class="cell">cell-3</div>
      <div id="cell-4" class="cell">cell-4</div>
    </div>

    <script src="mouse-move.js"></script>
  </body>
</html>
